<script type="module">
import init, * as bindings from './solidcraft-web-b7bc4950bac26a12.js';
const wasm = await init({ module_or_path: './solidcraft-web-b7bc4950bac26a12_bg.wasm' });

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  
  
  <link rel="stylesheet" href="./loading-40e06288284afd2b.css" integrity="sha384-eRJXGzGvBsYK5g+Szve9gR6lF3bDIBsms38kfSjVsxFaaUR1/ST/qGL8PJMXT2yR"/>
  
  <!-- Installable as an app (manifest.webmanifest) under the fork's own name and mark (SolidTouch);
       the loading screen keeps SolidCraft's animated logo, so the fork stays recognisable. -->
  <meta name="theme-color" content="#1e1e2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/solidtouch-32.png">
  <link rel="apple-touch-icon" href="icons/solidtouch-180.png">

<link rel="modulepreload" href="./solidcraft-web-b7bc4950bac26a12.js" crossorigin="anonymous" integrity="sha384-1zvYYOe0vnW8uRxZEKNEHnGE3oRcVrodBW8gOw+FAOjqgXzNvy8CZwp3d56bIziV"><link rel="preload" href="./solidcraft-web-b7bc4950bac26a12_bg.wasm" crossorigin="anonymous" integrity="sha384-3sAlbVHSbwCAiChco8aykKXcg9G7NgT4/viZv9lSVFVBcUPRHLQ4zM9ymEinpXml" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading SolidCraft&hellip;</span></div>
  <script>
    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
  </script>
</body>
</html>
